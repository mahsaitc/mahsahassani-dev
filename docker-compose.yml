services:
  web:
    build:
      context: .
      # Baked in at build time (client bundle + images.remotePatterns).
      # Changing these requires `docker compose build`, not just a restart.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        API_BASE_URL: ${API_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mahsahassani.dev}
    restart: unless-stopped
    depends_on:
      - api
    # Loopback by default; a reverse proxy on the host fronts it. Set
    # WEB_BIND=0.0.0.0 to expose it on every interface.
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    environment:
      # Server-side fetches and the admin proxy read this at runtime too.
      API_BASE_URL: ${API_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_FROM: ${CONTACT_FROM}
      CONTACT_TO: ${CONTACT_TO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    # Loopback only: the browser loads uploads from NEXT_PUBLIC_API_BASE_URL,
    # everything else reaches the API over the compose network as api:8080.
    ports:
      - '127.0.0.1:${API_PORT:-5099}:8080'
    environment:
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # Only used while the database has no users; ignored afterwards.
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: ${NEXT_PUBLIC_SITE_URL:-https://mahsahassani.dev}
    volumes:
      - api-data:/data

volumes:
  # SQLite database and uploads. Separate from any dev database on the host.
  api-data:
