services:
  web:
    build:
      context: .
      # Baked in at build time (client bundle + images.remotePatterns).
      # Changing these requires `docker compose build`, not just a restart.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        API_BASE_URL: ${API_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mahsahassani.dev}
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Server-side fetches and the admin proxy read this at runtime too.
      API_BASE_URL: ${API_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_FROM: ${CONTACT_FROM}
      CONTACT_TO: ${CONTACT_TO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
